# Required by docker-compose v1 (Raspberry Pi OS bookworm ships 1.29.2).
# Compose v2 ignores it with an "obsolete" warning, which is harmless.
version: "3.8"

services:
  bot:
    build: .
    image: stuard:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/stuard.sqlite3
      CONFIG_PATH: /app/config.yaml
      SAML_SP_KEY_FILE: /run/secrets/stuard/sp.key
      SAML_SP_CERT_FILE: /run/secrets/stuard/sp.crt
      SAML_IDP_METADATA_FILE: /app/saml/idp_metadata.xml
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8080"
      TRUST_FORWARDED_FOR: "true"
    volumes:
      - stuard_data:/data
      - ./config.yaml:/app/config.yaml:ro
      - ./saml:/app/saml:ro
      - ./secrets:/run/secrets/stuard:ro
    # No host port at all: only cloudflared, on the compose network, can reach the bot.
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Cloudflare Tunnel terminates TLS and reaches the bot over the compose network,
  # so nothing is published on the host and no router port is opened.
  # Use a tunnel of its own: sharing a token with another tunnel makes Cloudflare
  # load-balance both as replicas, and this container cannot serve the other's hostnames.
  # In Zero Trust the public hostname points at  http://bot:8080 .
  cloudflared:
    # Not pinned on purpose: Cloudflare retires old tunnel clients, so track the current one.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - bot
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env (Zero Trust -> Networks -> Tunnels)}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# To run without Cloudflare, delete the cloudflared service, restore the caddy
# service from Caddyfile, and publish 80/443 instead.

  # Optional: OpenVPN tunnel to STU (vpn.cvt.stuba.sk) that forwards ldap.stuba.sk:636 to the bot, so LDAP
  # enrichment (email.ldap.enabled) works WITHOUT routing the bot's Discord/e-mail traffic through the
  # university network — only LDAP goes through the tunnel. On the "ldap" profile, so a normal
  # `docker-compose up -d` never starts it; enable with:  docker-compose --profile ldap up -d stuvpn
  # Needs secrets/stu-vpn.ovpn (never commit it) and STU_VPN_USER / STU_VPN_PASS in .env.
  stuvpn:
    image: alpine:3.20
    profiles: ["ldap"]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      STU_VPN_USER: ${STU_VPN_USER:-}
      STU_VPN_PASS: ${STU_VPN_PASS:-}
      STU_LDAP_IP: ${STU_LDAP_IP:-147.175.1.11}
    volumes:
      - ./secrets/stu-vpn.ovpn:/etc/openvpn/stu.ovpn:ro
    networks:
      default:
        # The bot resolves ldap.stuba.sk to this sidecar; socat forwards it to STU over the tunnel.
        aliases:
          - ldap.stuba.sk
    command:
      - /bin/sh
      - -c
      - |
        set -e
        [ -n "$$STU_VPN_USER" ] && [ -n "$$STU_VPN_PASS" ] || { echo "stuvpn: set STU_VPN_USER and STU_VPN_PASS in .env"; exit 1; }
        apk add --no-cache openvpn socat >/dev/null
        umask 077
        printf '%s\n%s\n' "$$STU_VPN_USER" "$$STU_VPN_PASS" > /tmp/stu.auth
        socat TCP-LISTEN:636,fork,reuseaddr "TCP:$$STU_LDAP_IP:636" &
        exec openvpn --config /etc/openvpn/stu.ovpn

volumes:
  stuard_data:
